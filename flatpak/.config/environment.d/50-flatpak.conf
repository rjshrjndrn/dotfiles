# Add Flatpak app export dirs to XDG_DATA_DIRS so desktop launchers
# (walker/elephant, rofi, fuzzel, GNOME, KDE) find .desktop files.
#
# Read by systemd user manager at session start -> propagates to all
# user services and dbus-activated apps. Replaces the need to source
# /etc/profile.d/flatpak.sh in shell rc files for graphical sessions.
XDG_DATA_DIRS=${HOME}/.local/share/flatpak/exports/share:/var/lib/flatpak/exports/share:/usr/local/share:/usr/share
