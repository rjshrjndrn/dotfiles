# List of plugins
set -g @plugin 'tmux-plugins/tpm'
set -g @plugin 'tmux-plugins/tmux-resurrect'
set -g @plugin 'tmux-plugins/tmux-continuum'
set -g @plugin 'olimorris/tmux-pomodoro-plus'

set -g @plugin 'tmux-plugins/tmux-open'
set -g @open-S 'https://www.duckduckgo.com/'
set -g @open 'x'
set -g @open-editor 'C-x'

set -g @plugin 'christoomey/vim-tmux-navigator'

# Restore sessions
# for vim
set -g @resurrect-strategy-vim 'session'
# for neovim
set -g @resurrect-strategy-nvim 'session'
set -g @resurrect-capture-pane-contents 'on'
# Auto restore tmux session
# set -g @continuum-restore 'on'

unbind-key C-f
set -g prefix C-f
bind-key C-f send-prefix

# QoL #
set -g history-limit 50000

# Set the base index for windows to 1 instead of 0
set -g base-index 1

# Set the base index for panes to 1 instead of 0
setw -g pane-base-index 1

# Setting delay b/w prefix and command (0 is fine for local, increase for slow networks)
set -s escape-time 0

# Required for Neovim autoread and focus detection
set -g focus-events on

# splitting panes with | and - (preserving current path)
bind '\' split-window -h -c "#{pane_current_path}"
bind - split-window -v -c "#{pane_current_path}"

############################
# Remote machine min config
############################

# Setting vi mode keys
set -g mode-keys vi

# Creating key combo to reload config
bind r source-file ~/.tmux.conf \; display "Reloaded!"

# Creating window with name
bind-key C command-prompt -p "window name:" "new-window; rename-window '%%'"
bind-key S command-prompt -p "session name:" "new-session; rename-session '%%'"
# Re arranging windows numbering
set-option -g renumber-windows on

# Enabling mouse
set -g mouse on

# # Ensure we can send C-a to other apps; press C-a twice !!
# bind C-b send-prefix

# moving b/w panes with vi configs (handled by vim-tmux-navigator plugin)
# -n not to press prefix
# bind -n C-h select-pane -L
# bind -n C-l select-pane -R
# bind -n C-j select-pane -D
# bind -n C-k select-pane -U

# Pane resizing panes with Prefix H,J,K,L
# -r is to repeat the key without prefix
bind -r H resize-pane -L 5
bind -r J resize-pane -D 5
bind -r K resize-pane -U 5
bind -r L resize-pane -R 5

# Copying to system clipboard
# Ref: https://www.seanh.cc/2020/12/27/copy-and-paste-in-tmux/
# bind -T copy-mode-vi 'Y' send -X copy-pipe-no-clear "xsel -i --clipboard"
bind-key v copy-mode
# Detect if running on Wayland or X11 and set appropriate clipboard command
if-shell '[ -n "$WAYLAND_DISPLAY" ]' {
    # install using yay wl-clipboard
    set -s copy-command 'wl-copy'
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "wl-copy"
} {
    set -s copy-command 'xclip -sel clip -i'
    bind-key -T copy-mode-vi MouseDragEnd1Pane send-keys -X copy-pipe-no-clear "xclip -sel clip -i"
}
bind-key -T copy-mode-vi 'v' send-keys -X begin-selection
# bind-key -T copy-mode-vi 'y' send-keys -X copy-selection
bind-key -T copy-mode-vi 'y' send-keys -X copy-selection

#############################################################################

# Allow terminal passthrough (required for kitty graphics protocol, images, etc.)
set -g allow-passthrough all

# Support italics
set -g default-terminal "tmux-256color"
set -as terminal-features ",xterm-256color:RGB"
# Extended keys: enables CSI u protocol for disambiguating key combos (e.g. Ctrl+Shift+A vs Ctrl+A)
set -as terminal-features ',xterm-256color:extkeys'
set -as terminal-features ',xterm-kitty:extkeys'
set -g extended-keys on
set -g extended-keys-format csi-u
# Undercurl support for Neovim
set -as terminal-overrides ',*:Smulx=\E[4::%p1%dm'
set -as terminal-overrides ',*:Setulc=\E[58::2::%p1%{65536}%/%d::%p1%{256}%/%{255}%&%d::%p1%{255}%&%d%;m'

## Status bar

# Changing the tmux status bar background
set -g status-style fg=white,bg=black
setw -g window-status-current-style fg=white,bold,bg=red
set-option -g status-left-length 40
set -g status-left "#[fg=green]#S:#[fg=yellow]#I #(/bin/bash $HOME/.tmux/kube-tmux/kube.tmux 250 red cyan)"
# Status line right side -  31-Oct 13:37
set -g status-right "#{pomodoro_status}"
set -ag status-right "#[fg=cyan]%d %b %R"
# set -g status-right '#[fg=cyan] #(TZ="Asia/Kolkata" date)'

# Center the window list in the status line
set -g status-justify centre
# enable activity alerts
setw -g monitor-activity on
set -g visual-activity on

set -g @pomodoro_toggle 'P'                    #
set -g @pomodoro_cancel '_'             # Cancel a Pomodoro with tmux-prefix key + P
set -g @pomodoro_notifications 'on'    # Enable desktop notifications from your terminal
set -g @pomodoro_sound 'on'            # Sound for desktop notifications (Run `ls /System/Library/Sounds` for a list of sounds to use on Mac)
set -g @pomodoro_on " 🍅"                      # The formatted output when the Pomodoro is running
set -g @pomodoro_complete "✔︎ "                 # The formatted output when the break is running
set -g @pomodoro_pause "⏸︎ "                    # The formatted output when the Pomodoro/break is paused
set -g @pomodoro_prompt_break " ⏲︎ break?"      # The formatted output when waiting to start a break
set -g @pomodoro_prompt_pomodoro " ⏱︎ start?"   # The formatted output when waiting to start a Pomodoro

# active pane normal, other shaded out
# setw -g window-style fg=colour240,bg=colour235
# setw -g window-active-style fg=white,bg=black

# Tmux find session
unbind-key f
bind-key F run-shell -b "( tmux list-sessions -F \"##S\" | fzf-tmux -p --border=rounded --color=border:#ffffff | xargs tmux switch-client -t )"

# tmux variable need ##
# for example: #{window_activity} => ##{window_activity}
bind-key f run-shell -b '(
  tmux list-windows -F "##{window_activity} ##{window_id}: [##I] ##{window_name}" \
  | sort -nr \
  | cut -d ":" -f2- \
  | fzf-tmux -p --border=rounded --color=border:#ffffff \
  | cut -d "[" -f2 \
  | cut -d "]" -f1 \
  | xargs -I{} tmux select-window -t {}
)'

# Tmux switch to last session
bind-key -T prefix \; run-shell -b '(tmux select-window -t notes || tmux new-window -n notes)'
bind-key \' switch-client -l

bind-key a set-window-option synchronize-panes\; display-message "synchronize-panes is now #{?pane_synchronized,on,off}"

# set-window-option -g window-active-style bg=terminal,fg=terminal
# set -g pane-border-style bg=terminal,fg=terminal
# set -g pane-active-border-style bg=black,fg=blue
# set-window-option -g window-style        fg=colour247,bg=colour236

# Popup and pane border styling
set -g popup-border-style "fg=#ffffff,bold"
set -g popup-border-lines double
set -g pane-border-style "fg=#555555"
set -g pane-active-border-style "fg=#{?pane_synchronized,red,#ffffff}"

# Always keep this at bottom. Initialize tpm
run -b '~/.tmux/plugins/tpm/tpm'
