# Install Mise:
# curl https://mise.run | sh
# Activate: Put
# eval "$(mise activate bash)" in ~/.$bashrc
# eval "$(mise activate bash)" in ~/.$bashrc
#
# mise doctor
# mise plugins ls-remote
# mise plugins ls
# mise ls
# mise ls-remote java # to see the versions
# mise use java@21
# mise use k9s
# mise prune
# mise tool aws # check info about aws
#
# mise use -g <optional package else it'll show fuzzy all packages> # to globally install and add to this file
# mise use <optional package else it'll show fuzzy all packages> # to install in the project to create config mise.toml
#
# mise up # Install all packages defined in the config
[plugins]
neovim = "https://github.com/richin13/asdf-neovim"

[settings]
experimental = false
use_versions_host = false  # mise-versions.jdx.dev caches stale nightly digests (e.g. lightpanda)

# Add latency to mac terminal
disable_backends = ["vfox"]

# Temporary workaround for attestation issue
[settings.aqua]
github_attestations = false

[settings.github]
github_attestations = false

[settings.npm]
package_manager = "bun"

[tools]
###############
# Mise (meta)
###############
usage = "latest" # To generate completions.
"github:jdx/mise" = "latest"

###############
# Languages & Runtimes
###############
go = "latest"
node = "24"
rust = "latest"
uv = "latest"

###############
# Package Managers
###############
npm = "11"
yarn = "latest"
bun = "latest"

###############
# AI & LLM
###############
ollama = {version="latest", os=["mac"]}
claude = { version = "latest", bin = "claude", platforms = """
[linux-arm64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/linux-arm64/claude"

[linux-x64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/linux-x64/claude"

[macos-arm64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/darwin-arm64/claude"

[macos-x64]
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/darwin-x64/claude"

[windows-x64]
bin = "claude.exe"
url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/{{ version }}/win32-x64/claude.exe"
""", version_list_url = "https://storage.googleapis.com/claude-code-dist-86c565f3-f756-42ad-8dfa-d59b1c096819/claude-code-releases/latest" }
opencode = "latest"
"npm:@earendil-works/pi-coding-agent" = "latest"
"npm:@fission-ai/openspec" = "latest"
"npm:gitnexus" = "latest"
"npm:omniroute" = "latest"
# llm install llm-github-copilot
# llm github_copilot auth login
"pipx:llm" = "latest"
# Proxy to filter permissions for an app
"github:GreyhavenHQ/greywall" = "latest"
# Reduce context tokens
"npm:context-mode" = "latest"
# MCP browser
"github:lightpanda-io/browser" = "latest"
# Pass things from cli to ai
# fabric -y <yt url> --pattern extract-ideas
"github:danielmiessler/fabric" = "latest"

###############
# Cloud
###############
aws-cli = { version = "latest", symlink_bins = "true" }
localstack = "latest"
azure-cli = "latest"
scaleway = "latest"
# gcloud = "latest"

###############
# Kubernetes
###############
k9s = "latest"
stern = "latest"
kubectl = "latest"
kustomize = "latest"
k3d = "latest"
argo = "latest"
flux2 = "latest"
helm = "latest"
helm-diff = "latest"
kubeconform = "latest"
cilium-cli = "latest"
kubens = "latest"

###############
# Container / VM
###############
lima = "latest"
podman = {version = "latest", rename_exe = "podman"}
depot = { version = "latest", exe = "depot" }

###############
# Security
###############
trivy = "latest"
age = "latest"
sops = "latest"
gopass = "latest"
vals = "latest"
doppler = "latest"
infisical = "latest"
ggshield = "latest"

###############
# IaC
###############
opentofu = "latest"
terraform = "latest"
terragrunt = "latest"
packer = "latest"
ansible-core = "latest"

###############
# Git
###############
lazygit = "latest"
delta = "latest"
github-cli = "latest"

###############
# Terminal / Shell
###############
direnv = "latest"
tmux = "latest"
atuin = "latest"
starship = "latest"
fzf = "latest"

###############
# CLI Utilities
###############
jq = "latest"
yq = "latest"
ripgrep = "latest"
bat = "latest"
fd = "latest"
croc = "latest"
"github:zyedidia/eget" = "latest"
"github:rjshrjndrn/templater" = "latest"
# Alternative to tmate
# Usage: upterm host
"github:owenthereal/upterm" = "latest"

###############
# Databases
###############
duckdb = "latest"
